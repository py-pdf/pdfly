name: Check for Gitignored Files

on:
  push:
    branches:
      - '**' # Run on all branches
  pull_request:

permissions:
  contents: read

jobs:
  check-gitignored-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for tracked files that are gitignored
        run: |
          ignored_files=$(git ls-files --cached --ignored --exclude-standard)
          if [[ -n "$ignored_files" ]]; then
            echo "The following files are gitignored but committed:"
            echo "$ignored_files"
            exit 1
          fi

# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform: [ubuntu-latest, windows-latest, macos-latest]
    name: pytest on ${{ matrix.python-version }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: Install requirements
      run: pip install . --group dev
    - name: Install pdfly
      if: matrix.python-version != '3.8'
      run: pip install .
    - name: Install pdfly using the minimal versions of the dependencies
      if: matrix.python-version == '3.8'
      run: |
        # We ensure that those minimal versions remain compatible:
        sed -i '/dependencies = \[/,/\]/s/>=/==/' pyproject.toml
        pip install .
    - name: Install oscrypto with OpenSSL >= 3.0.10 support
      # oscrypto 1.3.0 (latest on PyPI) can't parse two-digit OpenSSL patch
      # versions: https://github.com/wbond/oscrypto/issues/75
      # The fixed commit still reports 1.3.0, hence --force-reinstall.
      run: pip install --force-reinstall --no-deps "oscrypto @ git+https://github.com/wbond/oscrypto.git@1547f535001ba568b239b8797465536759c742a3"
    - name: Run tests
      run: pytest -vv

  codestyle:
    name: Check code with black, mypy, ruff & typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
    - name: Cache Downloaded Files
      id: cache-downloaded-files
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: '**/tests/pdf_cache/*'
        key: cache-downloaded-files
    - name: Upgrade pip, install pdfly and its dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install . --group dev
    - name: Lint with black
      run: black --check --extend-exclude sample-files .
    - name: Lint with mypy
      run: mypy --ignore-missing-imports pdfly/ tests/
    - name: Test with ruff
      run: ruff check pdfly/ tests/
    - name: Spell Check Repo
      uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  package:
    name: Build & verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{env.PYTHON_LATEST}}
      - name: Build package 
        run: |
          python -m pip install flit check-wheel-contents
          flit build
          ls -l dist
          check-wheel-contents dist/*.whl
      - name: Test installing package
        run: python -m pip install .
      - name: Test running installed package
        working-directory: /tmp
        run: python -c "import pdfly;print(pdfly.__version__)"

  # Single stable check to mark as "required" in the branch protection rules,
  # so the matrix can change without touching the repository settings.
  ci-success:
    name: CI success
    if: always()
    needs: [tests, codestyle, package]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

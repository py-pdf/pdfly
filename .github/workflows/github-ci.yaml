name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_LATEST: "3.15"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        platform: [ubuntu-latest, windows-latest, macos-latest]
    name: pytest on ${{ matrix.python-version }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install pdfly and its dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev
    - name: Run tests
      run: pytest -vv

  tests-min-versions:
    name: pytest with minimal dependency versions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Pin the lower bounds of the dependencies
      # Uses the runner's system Python, as tomllib requires Python 3.11+
      run: |
        python3 - > constraints.txt <<'EOF'
        import re, tomllib
        deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
        for dep in deps:
            if m := re.fullmatch(r"([\w.-]+)(?:\[[^\]]*\])?>=([^,;\s]+)(?:,.*)?", dep):
                print(f"{m[1]}=={m[2]}")
        EOF
        cat constraints.txt
    - name: Setup Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - name: Install pdfly using the minimal versions of the dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev -c constraints.txt
    - name: Run tests
      run: pytest -vv

  codestyle:
    name: Check code with ruff, mypy & typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_LATEST }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install pdfly and its dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . --group dev
    - name: Check formatting with ruff
      run: ruff format --check .
    - name: Lint with ruff
      run: ruff check --output-format=github .
    - name: Lint with mypy
      run: mypy pdfly/ tests/
    - name: Spell Check Repo
      uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  package:
    name: Build & verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_LATEST }}
      - name: Build package
        run: |
          python -m pip install build check-wheel-contents
          python -m build
          ls -l dist
          check-wheel-contents dist/*.whl
      - name: Test installing package
        run: python -m pip install dist/*.whl
      - name: Test running installed package
        working-directory: /tmp
        run: python -c "import pdfly;print(pdfly.__version__)"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pdfly and its docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . --group docs
      - name: Build docs, treating warnings as errors
        working-directory: docs
        run: sphinx-build -W -b html . _build/html

  # Single stable check to mark as "required" in the branch protection rules,
  # so the matrix can change without touching the repository settings.
  ci-success:
    name: CI success
    if: always()
    needs: [tests, tests-min-versions, codestyle, package, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

# pre-commit run --all-files
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=1000']
    -   id: check-ast
    -   id: check-case-conflict
    -   id: check-docstring-first
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
        exclude: "resources/.*|docs/make.bat"
    -   id: fix-byte-order-marker
    -   id: mixed-line-ending
        args: ['--fix=lf']
        exclude: "docs/make.bat"
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
    -   id: ruff-check
        args: ['--fix']
    -   id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.1'
    hooks:
      - id: mypy
        files: ^pdfly/.*
        additional_dependencies:
        - "cryptography"
        - "endesive"
        - "fpdf2"
        - "pillow"
        - "pydantic>=1.10.4"
        - "pypdf[full]"
        - "rich"
        - "typer>=0.18.0"
-   repo: local
    hooks:
      # Uses the typer and rich versions of uv.lock, like CI does, as their
      # versions change the rendered help
      - id: check-cli-help
        name: check documented CLI help
        entry: uv run --frozen --isolated --no-dev python docs/check_cli_help.py --fix
        language: system
        pass_filenames: false
        files: ^(pdfly/.*\.py|README\.md|docs/index\.rst|docs/user/.*\.md|docs/check_cli_help\.py|uv\.lock)$
